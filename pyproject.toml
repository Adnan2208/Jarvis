[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.0.0",
    "python-dotenv>=1.2.1",
    "textual>=8.2.5",
]

[project.scripts]
Jarvis = "main:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "models", "availableFunctions", "prompts"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["functions*", "calculator*"]
namespaces = false

[tool.setuptools.package-data]
functions = ["functionsSchema.json"]
